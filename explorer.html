<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperLexicon — Multi-Subnet Block Explorer &amp; HFS Inspector</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 0%, #0b1830 0%, #050a14 68%);
        color: #f8fafc;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      .slx-exp-page-wrap {
        max-width: 1380px;
        margin: 0 auto;
        padding: 20px 18px 56px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      @media (max-width: 640px) {
        .slx-exp-page-wrap {
          padding: 10px 8px 40px;
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="slxUnifiedHeaderMount"></div>

    <main class="slx-exp-page-wrap">
      <div id="slx-explorer-section"></div>
    </main>

    <script type="module" src="/src/client-header.js"></script>
    <script type="module" src="/src/block-explorer.js"></script>
    <script type="module" src="/src/legal-consent.js"></script>
  </body>
</html>
