<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0d1424" />
    </linearGradient>

    <!-- Cyan Wave Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Purple Wave Gradient -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Slate Rounded App Badge -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg-grad)" stroke="#00e5ff" stroke-width="8" stroke-opacity="0.8" />

  <!-- Multi-layered Radio Waveform Emblem (matching official SuperLexicon logo) -->
  <g transform="translate(0, 10)" filter="url(#glow)">
    <!-- Sub-wave 1 (Purple background layer) -->
    <path d="M 40 256 Q 110 256, 140 230 T 210 330 T 265 140 T 320 310 T 375 220 T 472 256" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    
    <!-- Sub-wave 2 (Indigo mid layer) -->
    <path d="M 40 256 Q 115 256, 145 220 T 215 315 T 260 120 T 325 330 T 370 210 T 472 256" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.75" />

    <!-- Sub-wave 3 (Cyan/Purple primary wave layer) -->
    <path d="M 40 256 Q 120 256, 150 205 T 220 340 T 256 90 T 330 350 T 365 195 T 472 256" fill="none" stroke="url(#cyan-grad)" stroke-width="6" stroke-linecap="round" opacity="0.9" />

    <!-- Main High Peak Wave (Glowing Cyan Peak) -->
    <path d="M 40 256 Q 125 256, 155 190 T 225 355 T 256 64 T 335 360 T 360 180 T 472 256" fill="none" stroke="#00e5ff" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
