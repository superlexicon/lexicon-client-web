<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛠️ HFS WonderLab Studio — Visual Block-to-WASM App Builder for Kids &amp; Creators</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/slx-wallet.css" />
</head>
<body>
  <div class="ws-shell">
    <div id="slxUnifiedHeaderMount"></div>
    <button id="btnStudioGuide" data-uh-unhide="1" class="ws-btn ws-btn-xs" style="display:none;">📖 Builder Guide</button>

    <main class="ws-main">
      <!-- Top Welcome & 6 One-Click Starter Blueprints -->
      <section class="ws-top-strip">
        <div id="wsWelcomeMount"></div>
        <div id="wsCoachMount"></div>

        <div class="ws-templates-bar">
          <div class="ws-templates-label">
            <span class="ws-sparkle-pill mono">✨ STEP 0 · PICK A STARTER IDEA</span>
            <span class="ws-muted">Click any template to remix it — or start from a blank canvas!</span>
          </div>
          <div class="ws-template-pills" id="templatePillsMount"></div>
        </div>
      </section>

      <!-- Main Split Workspace: Left Scratch-Style Block Builder + Right Live Tablet Simulator & 1-Click Rocket Deploy -->
      <div class="ws-workspace">
        <!-- Left Column: 4 Colorful Snap-Block Builder Steps -->
        <section class="ws-builder-col">
          <div class="ws-step-tabs" id="builderStepTabs">
            <button type="button" class="ws-step-tab is-active" data-step="look" style="--tab-accent:#a855f7;">
              <span class="ws-step-num">1</span>
              <span>🎨 Look &amp; Stage</span>
            </button>
            <button type="button" class="ws-step-tab" data-step="vars" style="--tab-accent:#38bdf8;">
              <span class="ws-step-num">2</span>
              <span>📦 Memory Boxes</span>
            </button>
            <button type="button" class="ws-step-tab" data-step="actions" style="--tab-accent:#f59e0b;">
              <span class="ws-step-num">3</span>
              <span>⚡ Action Blocks</span>
            </button>
            <button type="button" class="ws-step-tab" data-step="code" style="--tab-accent:#10b981;">
              <span class="ws-step-num">4</span>
              <span>🏆 Goal &amp; Code Peek</span>
            </button>
          </div>

          <div class="ws-builder-panel" id="builderPanelMount"></div>
        </section>

        <!-- Right Column: Live Interactive Tablet Preview + WASM Compiler Status + 1-Click Subnet 1 Rocket Launch -->
        <aside class="ws-preview-col">
          <!-- Rocket Deploy Card -->
          <div class="ws-deploy-card">
            <div class="ws-deploy-top">
              <div>
                <div class="ws-deploy-eyebrow mono" id="lblCompilerBadge">⚙️ WASM READY · 1.7 KiB · HALT-FREE ✓</div>
                <div class="ws-deploy-title" id="lblDeployCardTitle">🚀 Ready to Launch Your HFS App!</div>
              </div>
              <button type="button" id="btnDeployToSubnet" class="ws-rocket-btn">
                🚀 Deploy to Subnet 1 ($0 Gas)
              </button>
            </div>

            <div class="ws-hash-strip mono" id="compilerHashesMount"></div>

            <!-- 4-Step Progress Stepper During Deployment -->
            <div class="ws-launch-steps" id="launchStepsBox" style="display:none;"></div>

            <!-- Celebration Banner Once Live on Subnet 1! -->
            <div class="ws-live-success" id="deployedSuccessBox" style="display:none;"></div>
          </div>

          <!-- Interactive Tablet Simulator -->
          <div class="ws-tablet-frame">
            <div class="ws-tablet-topbar">
              <div class="ws-tablet-dots"><span></span><span></span><span></span></div>
              <div class="ws-tablet-url mono" id="lblTabletUrl">🧪 Test Playground · Instant Preview</div>
              <button type="button" id="btnResetSim" class="ws-btn ws-btn-xs">↺ Reset Test</button>
            </div>
            <iframe
              id="studioPreviewIframe"
              title="Live HFS App Simulator"
              sandbox="allow-scripts"
              class="ws-preview-iframe"
            ></iframe>
          </div>
        </aside>
      </div>
    </main>

    <div id="wsToast" class="ws-toast"></div>
  </div>
</body>
</html>
