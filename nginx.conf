server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 128k;

    root /usr/share/nginx/html;
    index index.html;

    # Defensive HTTP Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Block access to hidden dotfiles (except ACME /.well-known/)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Universal HFS App Host Routing:
    # Any `/app/<slug>` or `/<slug>.html` (when not one of the 4 physical static shells)
    # falls back to `/app.html`, which resolves & verifies the `.html.gz` bundle from Subnet 1 `app_store.wasm`.
    location ^~ /app/ {
        try_files $uri /app.html;
    }

    location ~ ^/[a-z0-9_-]+\.html$ {
        try_files $uri /app.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
